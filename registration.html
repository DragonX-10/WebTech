<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <p>This HTML form demonstrates registration fields and validation. It does not create an account.</p>
    <form action="registration.html" method="post">
        <p>
            <label for="full-name">Full Name</label>
            <input type="text" id="full-name" name="full-name" required minlength="2" maxlength="100" placeholder="Enter your full name">
        </p>
        <p>
            <label for="student-id">Student ID</label>
            <input type="text" id="student-id" name="student-id" required maxlength="30" placeholder="Enter your student ID">
        </p>
        <p>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="Enter your email">
        </p>
        <p>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="8" maxlength="64" placeholder="Enter at least 8 characters">
        </p>
        <p>
            <label for="birthday">Birthday</label>
            <input type="date" id="birthday" name="birthday" required>
        </p>
        <fieldset>
            <legend>Gender</legend>
            <input type="radio" id="male" name="gender" value="male" required>
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label>
        </fieldset>
        <p>
            <label for="program">Program</label>
            <select id="program" name="program" required>
                <option value="">Select your program</option>
                <option value="information-technology">Information Technology</option>
                <option value="computer-science">Computer Science</option>
                <option value="information-systems">Information Systems</option>
                <option value="other">Other</option>
            </select>
        </p>
        <fieldset>
            <legend>Hobbies</legend>
            <input type="checkbox" id="reading" name="hobbies" value="reading">
            <label for="reading">Reading</label>
            <input type="checkbox" id="gaming" name="hobbies" value="gaming">
            <label for="gaming">Gaming</label>
            <input type="checkbox" id="sports" name="hobbies" value="sports">
            <label for="sports">Sports</label>
        </fieldset>
        <p>
            <label for="address">Address</label><br>
            <textarea id="address" name="address" rows="3" cols="40" required maxlength="300" placeholder="Enter your address"></textarea>
        </p>
        <p>
            <label for="comments">Comments</label><br>
            <textarea id="comments" name="comments" rows="4" cols="40" maxlength="1000" placeholder="Enter your comments"></textarea>
        </p>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>
    <p><a href="index.html">Home</a></p>
</body>
</html>
